<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NO 钱包自动化</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; font: 16px "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    main { text-align: center; } .spinner { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #cbd6e6; border-top-color: #1668dc; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body><main><div class="spinner"></div><div>正在启动本地控制台…</div></main></body>
</html>
